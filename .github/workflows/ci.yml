name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  lint-contract:
    name: Lint example contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        run: swift build --product tandha

      - name: Lint the example contract
        run: |
          .build/debug/tandha lint Examples/automation-ids.json \
            --naming dotted-snake
