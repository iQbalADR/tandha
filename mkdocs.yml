site_name: tandha
site_description: >-
  Centralized UI automation-identifier toolkit for iOS — one shared JSON
  contract, set once via XIB/UIKit/SwiftUI and queried by XCUITest and
  Appium-based tools, with type-safe codegen, export, and lint.
site_url: https://iqbaladr.github.io/tandha/
repo_url: https://github.com/iQbalADR/tandha
repo_name: iQbalADR/tandha
copyright: © 2026 iQbalADR · MIT License
docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    logo: material/tag-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - Assigning identifiers: assigning.md
      - XCUITest: xcuitest.md
      - Codegen & plugin: codegen.md
      - Export: export.md
      - Lint: lint.md
  - Reference:
      - CLI: cli.md
      - JSON format: format.md
      - Good first issues: good-first-issues.md
      - Design & roadmap: DESIGN.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
